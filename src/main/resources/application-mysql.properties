# ===== Perfil MySQL (opcional) =====
# Para usar: rode com o perfil "mysql" ativo
#   (IntelliJ: Run > Edit Configurations > Active profiles = mysql)
#   (Maven:    mvn spring-boot:run -Dspring-boot.run.profiles=mysql)
# Ajuste usuario e senha conforme o seu MySQL.
spring.datasource.url=jdbc:mysql://localhost:3306/baozistore?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

spring.h2.console.enabled=false
