spring.application.name=baozi-store
server.port=8080

# ===== Banco de dados H2 (padrao) =====
# Banco em memoria: ao reiniciar a aplicacao os dados sao apagados e os ids voltam a 1
spring.datasource.url=jdbc:h2:mem:baozistore
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console web do H2: http://localhost:8080/h2-console
# (JDBC URL: jdbc:h2:mem:baozistore  | usuario: sa | senha em branco)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# JSON formatado e datas no formato yyyy-MM-dd
spring.jackson.serialization.indent-output=true
spring.jackson.serialization.write-dates-as-timestamps=false
